<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Fine Zoom 확대창</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  video { display: none; }
  #bar { position: fixed; top: 6px; right: 6px; display: flex; gap: 4px; align-items: center;
         padding: 3px 6px; border-radius: 8px; background: #1e1b4bd9; color: #fff;
         font: 600 12px "Segoe UI", system-ui, sans-serif; opacity: 0; transition: opacity .15s; }
  body:hover #bar { opacity: 1; }
  #bar button { border: 0; border-radius: 5px; background: #ffffff22; color: #fff; font: inherit;
                padding: 2px 8px; cursor: pointer; }
  #bar span { min-width: 46px; text-align: center; }
  #msg { position: fixed; inset: 0; display: none; place-items: center; color: #ccc; text-align: center;
         font: 13px "Segoe UI", system-ui, sans-serif; padding: 16px; }
</style>
</head>
<body>
  <video id="v" muted autoplay></video>
  <canvas id="c"></canvas>
  <div id="bar"><button id="minus">−</button><span id="pct"></span><button id="plus">+</button><button id="close">✕</button></div>
  <div id="msg"></div>
  <script src="lens.js"></script>
</body>
</html>
