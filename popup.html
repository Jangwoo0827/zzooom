<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #ffffff; --fg: #1e1b4b; --muted: #8b8aa3; --card: #f4f4fb;
    --line: #e4e4f0; --accent: #6366f1; --accent2: #8b5cf6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17162a; --fg: #eeeeff; --muted: #8e8cad; --card: #232240; --line: #2f2d52; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 290px; padding: 14px; background: var(--bg); color: var(--fg);
         font: 13px "Segoe UI", system-ui, sans-serif; user-select: none; }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  header img { width: 20px; height: 20px; }
  header b { font-size: 14px; flex: 1; }
  .reset { border: 0; background: none; color: var(--accent); cursor: pointer; font: inherit; font-weight: 600; }
  .display { display: flex; align-items: center; gap: 6px; background: var(--card);
             border-radius: 14px; padding: 8px; margin-bottom: 12px; }
  .val { display: flex; align-items: baseline; justify-content: center; flex: 1; }
  .val input { width: 90px; border: 0; background: none; color: var(--fg); text-align: right;
               font: 700 34px "Segoe UI", system-ui; outline: none; padding: 0; }
  .val input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .val span { font-size: 18px; font-weight: 600; color: var(--muted); margin-left: 2px; }
  .step { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line);
          background: var(--bg); color: var(--fg); font-size: 18px; cursor: pointer; }
  .step:hover { border-color: var(--accent); color: var(--accent); }
  .col { display: flex; flex-direction: column; gap: 4px; }
  .col .step { height: 25px; font-size: 11px; }
  input[type=range] { -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2)) 0 / var(--p, 10%) 100% no-repeat, var(--line);
    outline: none; margin: 4px 0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: #fff; border: 3px solid var(--accent); box-shadow: 0 1px 4px #0003; cursor: pointer; }
  .scale { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; margin-bottom: 12px; }
  .presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
  .presets button { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 8px;
                    padding: 6px 0; cursor: pointer; font: 600 12px "Segoe UI", system-ui; }
  .presets button:hover { border-color: var(--accent); }
  .presets button.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-color: transparent; }
  .area { width: 100%; border: 0; border-radius: 10px; padding: 9px 0; margin-bottom: 10px; cursor: pointer;
          background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
          font: 600 13px "Segoe UI", system-ui; }
  .area:hover { filter: brightness(1.08); }
  .setting { display: flex; align-items: center; justify-content: space-between; background: var(--card);
             border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; font-weight: 600; }
  .setting input { width: 52px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
                   color: var(--fg); font: 600 13px "Segoe UI", system-ui; text-align: right; padding: 3px 6px;
                   margin-right: 3px; outline: none; }
  .setting input:focus { border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 11px; line-height: 1.7; border-top: 1px solid var(--line); padding-top: 10px; }
  kbd { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font: 10px Consolas, monospace; }
</style>
</head>
<body>
  <header><img src="icons/icon32.png" alt=""><b>Fine Zoom</b><button class="reset" id="reset">100%로</button></header>
  <div class="display">
    <div class="col"><button class="step" data-d="-10">−10</button><button class="step" data-d="-5">−5</button></div>
    <button class="step" data-d="-1">−</button>
    <label class="val"><input id="num" type="number" min="5" max="1000" step="1"><span>%</span></label>
    <button class="step" data-d="1">+</button>
    <div class="col"><button class="step" data-d="10">+10</button><button class="step" data-d="5">+5</button></div>
  </div>
  <input id="range" type="range" min="5" max="1000" step="1">
  <div class="scale"><span>5%</span><span>250%</span><span>500%</span><span>750%</span><span>1000%</span></div>
  <div class="presets">
    <button data-v="25">25</button><button data-v="50">50</button><button data-v="67">67</button>
    <button data-v="75">75</button><button data-v="90">90</button>
    <button data-v="100">100</button><button data-v="110">110</button><button data-v="125">125</button>
    <button data-v="150">150</button><button data-v="200">200</button>
  </div>
  <button class="area" id="area">⬚ 영역만 확대해서 보기</button>
  <div class="setting">
    <span><kbd>Ctrl</kbd>+휠 · 단축키 한 칸당</span>
    <label><input id="wstep" type="number" min="1" max="100" step="1">%</label>
  </div>
  <div class="hint">
    <kbd>Ctrl</kbd>+휠 / 단축키는 25~500% 안에서만 · 그 밖은 팝업에서만<br>
    <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>↑</kbd><kbd>↓</kbd> 조절 · <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>0</kbd> 초기화<br>
    <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> 영역 확대
  </div>
  <script src="zoom.js"></script>
  <script src="popup.js"></script>
</body>
</html>
